<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Description | Smart ATS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        /* Background */
        .bg {
            background-image: url("https://images.unsplash.com/photo-1521737604893-d14cc237f11d");
            height: 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            position: relative;
        }

        /* Overlay */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            background: rgba(0, 0, 0, 0.65);
        }

        /* Content */
        .content {
            position: relative;
            z-index: 2;
            padding-top: 120px;
        }

        .jd-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 35px;
            max-width: 700px;
            margin: auto;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }
    </style>
</head>

<body>

<!-- 🔹 NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background: rgba(0,0,0,0.6);">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">Smart ATS</a>

        <div class="collapse navbar-collapse show">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'upload' %}">Pipeline</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="{% url 'rank' %}">Rank</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'analytics' %}">Analytics</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-warning fw-semibold" href="{% url 'logout' %}">Logout</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="bg">
    <div class="overlay"></div>

    <div class="content container">

        <div class="jd-card">
            <h3 class="text-center mb-3">📝 Enter Job Description</h3>
            <p class="text-center text-muted mb-4">
                Provide job role details to rank resumes using ATS & SBERT analysis
            </p>

            <form method="post">
                {% csrf_token %}

                {{ form.as_p }}

                <button class="btn btn-success w-100 py-2 mt-2">
                    Rank Resumes
                </button>
            </form>
        </div>

        <div class="text-center mt-4">
            <a href="{% url 'dashboard' %}" class="btn btn-secondary">
                ⬅ Back to Dashboard
            </a>
        </div>

    </div>
</div>

</body>
</html>
