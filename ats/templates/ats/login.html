<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Smart ATS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
            font-family: "Segoe UI", Arial, sans-serif;
        }
        .bg {
            background-image: url("https://images.unsplash.com/photo-1521737604893-d14cc237f11d");
            height: 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            position: relative;
        }
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #ffffff;
            padding: 35px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .login-card h2 {
            text-align: center;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .login-card p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }
    </style>
</head>

<body>
<div class="bg">
<div class="login-container">
    <div class="login-card">

        <h2>Login</h2>
        <p>Access your Smart ATS account</p>

        {% if error %}
            <div class="alert alert-danger text-center">
                {{ error }}
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label fw-semibold">Username</label>
                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter username"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter password"
                    required
                >
            </div>

            <button class="btn btn-primary w-100 py-2">
                Login
            </button>
        </form>

        <div class="text-center mt-3">
            Don’t have an account?
            <a href="{% url 'register' %}" class="fw-semibold">Register</a>
        </div>

    </div>
</div>
</div>
</body>
</html>
