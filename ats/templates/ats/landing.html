<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart ATS – Resume Ranking System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        /* Background image */
        .bg {
            background-image: url("https://images.unsplash.com/photo-1521737604893-d14cc237f11d");
            height: 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            position: relative;
        }

        /* Dark overlay */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            background: rgba(0, 0, 0, 0.65);
        }

        /* Content */
        .content {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;
            padding: 20px;
        }

        .content h1 {
            font-size: 3rem;
            font-weight: 700;
        }

        .content p {
            font-size: 1.2rem;
            margin-top: 15px;
            margin-bottom: 30px;
            color: #e0e0e0;
        }

        .btn-custom {
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 30px;
        }

        .footer {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            color: #ccc;
            font-size: 0.9rem;
            z-index: 2;
        }
    </style>
</head>

<body>

<div class="bg">
    <div class="overlay"></div>

    <div class="content">
        <div>
            <h1>Smart ATS System</h1>
            <p>
                AI-Powered Resume Shortlisting, Skill Gap Analysis  
                <br>
                & Intelligent Candidate Ranking
            </p>

            <div class="d-flex justify-content-center gap-3">
                <a href="{% url 'login' %}" class="btn btn-success btn-custom">
                    Login
                </a>
                <a href="{% url 'register' %}" class="btn btn-outline-light btn-custom">
                    Register
                </a>
            </div>
        </div>
    </div>

    <div class="footer">
        © {{ year|default:"2026" }} Smart ATS | Powered by AI & NLP
    </div>
</div>

</body>
</html>
